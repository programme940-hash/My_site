<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank You</title>
<meta name="theme-color" content="#05050a">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Thank You">
<meta property="og:description" content="A small thank-you note.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    /* Colors — dark void base + a cool indigo/violet/blue family */
    --void: #05050a;
    --indigo: 99, 102, 241;
    --violet: 139, 92, 246;
    --blue: 96, 165, 250;
    --text-primary: #f5f5f6;
    --text-secondary: rgba(245, 245, 246, 0.75);
    --text-tertiary: rgba(245, 245, 246, 0.55);

    /* Typography */
    --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    /* Motion */
    --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    --dur-reveal: 1.5s;

    /* Spacing / layout */
    --gap: clamp(1rem, 3vw, 1.5rem);
    --content-width: 34rem;
    --glow-blur: 90px;
  }

  /* ============================================================
     RESET & BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    color-scheme: dark;
    scrollbar-color: rgba(245, 245, 246, 0.25) transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--void);
    color: var(--text-primary);
    font-family: var(--font-main);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    overscroll-behavior-y: none;
    position: relative;
    cursor: default;
  }

  ::selection {
    background: rgba(var(--indigo), 0.35);
    color: var(--text-primary);
  }

  /* ============================================================
     ATMOSPHERIC BACKGROUND
     ============================================================ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    will-change: transform;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(var(--indigo), 0.09), transparent 55%),
      radial-gradient(ellipse 70% 55% at 90% 100%, rgba(var(--violet), 0.06), transparent 60%),
      var(--void);
  }

  /* Ambient glow blobs */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(var(--glow-blur));
    opacity: 0;
    transition: opacity 3s var(--ease-soft);
  }

  .glow-1 {
    width: 62vmax;
    height: 62vmax;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(var(--indigo), 0.3), transparent 70%);
    animation: drift-1 26s ease-in-out infinite;
  }
  .bg.loaded .glow-1 { opacity: 0.55; }
  .bg.bright .glow-1 { opacity: 0.85; }
  .bg.calm .glow-1   { opacity: 0.4; }

  .glow-2 {
    width: 45vmax;
    height: 45vmax;
    left: 25%;
    top: 65%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(var(--violet), 0.18), transparent 70%);
    animation: drift-2 32s ease-in-out infinite;
  }
  .bg.loaded .glow-2 { opacity: 0.5; }
  .bg.calm .glow-2   { opacity: 0.3; }

  @keyframes drift-1 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-47%, -54%) scale(1.06); }
  }
  @keyframes drift-2 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-53%, -47%) scale(1.08); }
  }

  /* The brighter moment for "Have a great day!" */
  .glow-bright {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 38%, rgba(var(--blue), 0.16), transparent 65%);
    opacity: 0;
    transition: opacity 2.2s var(--ease-soft);
  }
  .bg.bright .glow-bright { opacity: 1; }

  /* A very faint, slowly drifting chess-piece silhouette for the chess line */
  .pawn-bg {
    position: absolute;
    top: 58%;
    left: 22%;
    font-size: clamp(9rem, 24vw, 17rem);
    line-height: 1;
    color: rgba(var(--indigo), 0.06);
    opacity: 0;
    transform: translate(-50%, -50%) rotate(-8deg);
    transition: opacity 2.6s var(--ease-soft);
    animation: pawn-drift 34s ease-in-out infinite;
    user-select: none;
  }
  .bg.chess .pawn-bg { opacity: 1; }
  @keyframes pawn-drift {
    0%, 100% { transform: translate(-50%, -50%) rotate(-8deg) translateX(0); }
    50%      { transform: translate(-50%, -50%) rotate(-5deg) translateX(3.5vw); }
  }

  /* Tiny floating particles */
  .particles { position: absolute; inset: 0; }
  .particle {
    position: absolute;
    bottom: -5%;
    left: var(--x);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: rgba(245, 245, 246, 0.55);
    filter: blur(0.5px);
    opacity: 0;
    animation: particle-rise var(--dur) ease-in infinite;
    animation-delay: var(--delay);
  }
  @keyframes particle-rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.55; }
    50%  { transform: translateY(-52vh) translateX(var(--drift)); opacity: 0.3; }
    92%  { opacity: 0.12; }
    100% { transform: translateY(-100vh) translateX(calc(var(--drift) * 1.5)); opacity: 0; }
  }

  /* Faint film-grain texture */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.045;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.8'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Cursor-following glow (desktop only, activated by JS) */
  .cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--indigo), 0.12), transparent 70%);
    transform: translate3d(calc(var(--cx, 50vw) - 50%), calc(var(--cy, 50vh) - 50%), 0);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    transition: opacity 0.8s ease;
  }
  .cursor-glow.active { opacity: 1; }

  /* ============================================================
     CONTENT
     ============================================================ */
  .stage {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 1.5rem;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: var(--content-width);
  }

  /* Base reveal state — every line starts hidden, blurred, and shifted down */
  .line {
    margin: 0 0 var(--gap);
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
    transition:
      opacity var(--dur-reveal) var(--ease-soft),
      transform var(--dur-reveal) var(--ease-soft),
      filter calc(var(--dur-reveal) - 0.1s) var(--ease-soft);
  }
  .line.visible {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
  .line:last-child { margin-bottom: 0; }
  .line[data-step="2"] { margin-bottom: 0.35em; } /* pairs tightly with step 3 */

  .line.headline {
    font-size: clamp(2.1rem, 7vw, 3.25rem);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: clamp(1.8rem, 5vw, 2.6rem);
    text-shadow: 0 2px 30px rgba(var(--indigo), 0.3);
  }

  .line:not(.headline) {
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    font-weight: 400;
    line-height: 1.65;
    color: var(--text-secondary);
    letter-spacing: 0.005em;
  }

  /* Small bob for the inline pawn within the chess sentence */
  .pawn-inline { display: inline-block; animation: pawn-bob 3.4s ease-in-out infinite; }
  @keyframes pawn-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* "I hope you win!" — the most playful moment: a soft pop + gradient tint */
  .line.playful {
    font-weight: 500;
    transform: translateY(14px) scale(0.94);
    transition:
      opacity 1.2s var(--ease-soft),
      transform 1.1s var(--ease-pop),
      filter 1.1s var(--ease-soft);
    background: linear-gradient(135deg, var(--text-primary) 10%, rgb(var(--blue)) 55%, rgb(var(--violet)) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .line.playful.visible { transform: translateY(0) scale(1); }

  /* "That's it." — quiet, understated close */
  .line.final {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    font-style: italic;
    font-weight: 300;
    letter-spacing: 0.03em;
    color: var(--text-tertiary);
    margin-top: clamp(0.6rem, 2vw, 1rem);
  }

  /* ============================================================
     REDUCED MOTION — simple fades, no drift / blur / parallax
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    .glow-1, .glow-2, .pawn-bg, .particle, .pawn-inline {
      animation: none !important;
    }
    .line {
      transition: opacity 0.6s ease !important;
      transform: none !important;
      filter: none !important;
    }
    .cursor-glow { display: none !important; }
  }

  /* ============================================================
     RESPONSIVE ADJUSTMENTS
     ============================================================ */
  @media (max-width: 420px) {
    .stage { padding: 7vh 1.25rem; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow-bright"></div>
    <div class="pawn-bg">♟</div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="noise" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <main class="stage">
    <div class="content">
      <h1 class="line headline" data-step="1">Thank you!</h1>
      <p class="line" data-step="2">Thank you for your help.</p>
      <p class="line" data-step="3">I really appreciate it.</p>
      <p class="line" data-step="4">I just wanted to say that. :)</p>
      <p class="line" data-step="5">Have a great day!</p>
      <p class="line" data-step="6">I think that's all...</p>
      <p class="line" data-step="7">I've run out of ideas, so go play some chess. <span class="pawn-inline" aria-hidden="true">♟️</span></p>
      <p class="line playful" data-step="8">I hope you win!</p>
      <p class="line final" data-step="9">That's it.</p>
    </div>
  </main>

  <noscript>
    <style>
      .line { opacity: 1 !important; transform: none !important; filter: none !important; }
      .glow-1, .glow-2 { opacity: 0.5 !important; }
    </style>
  </noscript>

  <script>
    (function () {
      'use strict';

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      var bg = document.querySelector('.bg');
      var cursorGlow = document.querySelector('.cursor-glow');
      var particleHost = document.getElementById('particles');

      /* ---------- Ambient particles (skipped entirely under reduced motion) ---------- */
      function buildParticles(count) {
        var frag = document.createDocumentFragment();
        for (var i = 0; i < count; i++) {
          var p = document.createElement('span');
          p.className = 'particle';
          p.style.setProperty('--x', (Math.random() * 100).toFixed(2) + '%');
          p.style.setProperty('--size', (Math.random() * 1.6 + 1).toFixed(2) + 'px');
          p.style.setProperty('--dur', (16 + Math.random() * 14).toFixed(2) + 's');
          p.style.setProperty('--delay', (Math.random() * -26).toFixed(2) + 's');
          p.style.setProperty('--drift', (Math.random() * 50 - 25).toFixed(1) + 'px');
          frag.appendChild(p);
        }
        particleHost.appendChild(frag);
      }
      if (!reduceMotion && particleHost) {
        buildParticles(22);
      }

      /* ---------- Cinematic reveal timeline ----------
         Each entry waits `wait` ms after the previous step, then reveals
         a line and/or runs a small side-effect (brighten, chess mood, calm). */
      var timeline = [
        { wait: 300,  run: function () { bg.classList.add('loaded'); } },
        { wait: 1400, step: 1 },
        { wait: 2200, step: 2 },
        { wait: 900,  step: 3 },
        { wait: 1600, step: 4 },
        { wait: 2200, step: 5, run: function () { bg.classList.add('bright'); } },
        { wait: 2200, step: 6 },
        { wait: 2600, step: 7, run: function () { bg.classList.add('chess'); } },
        { wait: 2400, step: 8 },
        { wait: 2200, step: 9, run: function () {
            bg.classList.remove('bright');
            bg.classList.remove('chess');
            bg.classList.add('calm');
          } }
      ];

      var elapsed = 0;
      timeline.forEach(function (item) {
        elapsed += item.wait;
        setTimeout(function () {
          if (item.step) {
            var el = document.querySelector('.line[data-step="' + item.step + '"]');
            if (el) el.classList.add('visible');
          }
          if (item.run) item.run();
        }, elapsed);
      });

      /* ---------- Cursor-following glow + gentle parallax (desktop only) ---------- */
      if (isFinePointer && !reduceMotion && cursorGlow && bg) {
        var targetX = window.innerWidth / 2;
        var targetY = window.innerHeight / 2;
        var curX = targetX;
        var curY = targetY;
        var running = false;

        var tick = function () {
          curX += (targetX - curX) * 0.08;
          curY += (targetY - curY) * 0.08;
          cursorGlow.style.setProperty('--cx', curX.toFixed(1) + 'px');
          cursorGlow.style.setProperty('--cy', curY.toFixed(1) + 'px');

          var dx = (curX - window.innerWidth / 2) / window.innerWidth;
          var dy = (curY - window.innerHeight / 2) / window.innerHeight;
          bg.style.transform = 'translate3d(' + (dx * -12).toFixed(2) + 'px, ' + (dy * -12).toFixed(2) + 'px, 0)';

          requestAnimationFrame(tick);
        };

        window.addEventListener('pointermove', function (e) {
          targetX = e.clientX;
          targetY = e.clientY;
          if (!running) {
            running = true;
            cursorGlow.classList.add('active');
            tick();
          }
        }, { passive: true });
      }
    })();
  </script>

</body>
</html>
